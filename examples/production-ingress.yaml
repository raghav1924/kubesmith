apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-gateway
  namespace: production
spec:
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
