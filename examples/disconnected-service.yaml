apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: phantom-billing-service
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-worker
  namespace: production
  labels:
    app: actual-billing-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: actual-billing-worker
  template:
    metadata:
      labels:
        app: actual-billing-worker
    spec:
      containers:
      - name: worker
        image: billing:v1.2.0
