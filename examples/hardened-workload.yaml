apiVersion: apps/v1
kind: Deployment
metadata:
  name: secured-api
  namespace: production
  labels:
    app: secured-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: secured-api
  template:
    metadata:
      labels:
        app: secured-api
    spec:
      containers:
      - name: api
        image: api-service:v2.4.1
        securityContext:
          privileged: false
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: secured-api-svc
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: secured-api
  ports:
  - port: 80
    targetPort: 8080
