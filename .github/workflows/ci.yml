name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript
      run: npm run build

    - name: Run Test Suite
      run: npm test

    - name: Run Self-Audit on Hardened Workload
      run: |
        node dist/bin.js audit examples/hardened-workload.yaml --min-score=90
